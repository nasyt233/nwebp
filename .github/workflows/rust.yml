name: Build and Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如: 0.1.0)'
        required: false
        type: string

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false  # 允许其他任务继续运行
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: .exe
            platform: windows-amd64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ''
            platform: linux-amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            suffix: ''
            platform: linux-arm64
          - os: ubuntu-latest
            target: aarch64-linux-android
            suffix: ''
            platform: termux-aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          fi
          SHORT=$(echo $VERSION | cut -d. -f1-2)
          echo "short=$SHORT" >> $GITHUB_OUTPUT
          echo "full=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=nwebp-$SHORT" >> $GITHUB_OUTPUT

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compile dependencies (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Install cross-compile dependencies (Android ARM64)
        if: matrix.target == 'aarch64-linux-android'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-android binutils-aarch64-linux-android

      - name: Build
        shell: bash
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: aarch64-linux-android-gcc

      - name: Package
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.short }}"
          PLATFORM="${{ matrix.platform }}"
          SUFFIX="${{ matrix.suffix }}"
          mkdir -p release
          cp "target/${{ matrix.target }}/release/nwebp$SUFFIX" "release/nwebp-${VERSION}-${PLATFORM}${SUFFIX}" 2>/dev/null || echo "Build failed for ${{ matrix.platform }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nwebp-${{ steps.version.outputs.short }}-${{ matrix.platform }}
          path: release/*
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -la artifacts/

      - name: Get version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          fi
          SHORT=$(echo $VERSION | cut -d. -f1-2)
          echo "short=$SHORT" >> $GITHUB_OUTPUT
          echo "tag=nwebp-$SHORT" >> $GITHUB_OUTPUT

      - name: Create tag
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}