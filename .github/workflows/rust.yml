name: Auto Build & Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如: 0.1.0)'
        required: false
        type: string

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: .exe
            platform: windows-amd64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ''
            platform: linux-amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            suffix: ''
            platform: linux-arm64
          - os: ubuntu-latest
            target: aarch64-linux-android
            suffix: ''
            platform: termux-aarch64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          fi
          SHORT=$(echo $VERSION | cut -d. -f1-2)
          echo "full=$VERSION" >> $GITHUB_OUTPUT
          echo "short=$SHORT" >> $GITHUB_OUTPUT
          echo "tag=nwebp-$SHORT" >> $GITHUB_OUTPUT

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          override: true

      - name: Install cross-compile dependencies
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install Android dependencies
        if: matrix.target == 'aarch64-linux-android'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-android

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: aarch64-linux-android-gcc

      - name: Package
        run: |
          VERSION=${{ steps.version.outputs.short }}
          PLATFORM=${{ matrix.platform }}
          SUFFIX=${{ matrix.suffix }}
          mkdir -p release
          cp target/${{ matrix.target }}/release/nwebp$SUFFIX release/nwebp-$VERSION-$PLATFORM$SUFFIX

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: nwebp-${{ steps.version.outputs.short }}-${{ matrix.platform }}
          path: release/*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Get version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          fi
          SHORT=$(echo $VERSION | cut -d. -f1-2)
          echo "short=$SHORT" >> $GITHUB_OUTPUT
          echo "tag=nwebp-$SHORT" >> $GITHUB_OUTPUT

      - name: Create tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}