[package]
name = "nwebp"
version = "0.1.0"
edition = "2021"
description = "轻量级漫画图片在线浏览服务器，支持翻页阅读"
readme = "README.md"
homepage = "https://nasyt.hoha.top"
repository = "https://github.com/nasyt233/nwebp"
license = "MIT OR Apache-2.0"
keywords = ["nweb", "nasyt", "web", "comic", ]

[[bin]]
name = "nwebp"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "=1.40.0", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = "=1.0.128"
clap = { version = "=4.5.20", features = ["derive"] }
anyhow = "1"
walkdir = "2"
percent-encoding = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"